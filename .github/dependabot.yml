# Dependabot configuration.
#
# Covers the automated dependency surfaces in this repo: the pinned action SHAs
# in .github/workflows/ and the Rust workspace dependencies in Cargo.toml /
# Cargo.lock (the lockfile is committed and CI builds with --locked, so a bump
# must arrive as a reviewed lockfile change). Mise-managed tools (node,
# gitleaks, markdownlint-cli2) are bumped manually via `mise upgrade`; the Rust
# toolchain is pinned in rust-toolchain.toml and bumped by hand.
#
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      # Group all action SHA bumps into a single PR per week to reduce noise.
      actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      # One Cargo PR per week, as for actions.
      cargo:
        patterns:
          - "*"
