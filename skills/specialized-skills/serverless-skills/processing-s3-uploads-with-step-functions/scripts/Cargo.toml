[package]
name = "s3-upload-processor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Lambda and Fargate processors for the S3 upload Step Functions workflow (Rust port of lambda_function.py and fargate_processor.py, #4397)."

[features]
# The Lambda binary needs the Lambda runtime; the Fargate container build
# disables it (`--no-default-features`) so it does not compile it.
default = ["lambda"]
lambda = ["dep:lambda_runtime"]

[[bin]]
name = "lambda-processor"
path = "src/bin/lambda_processor.rs"
required-features = ["lambda"]

[[bin]]
name = "fargate-processor"
path = "src/bin/fargate_processor.rs"

[dependencies]
aws-config = { version = "=1.13.0", default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "=1.155.0", default-features = false, features = ["rustls", "rt-tokio", "behavior-version-latest"] }
lambda_runtime = { version = "=1.5.0", optional = true }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "fs", "io-util"] }

[dev-dependencies]
aws-smithy-http-client = { version = "=1.5.1", default-features = false, features = ["test-util"] }
aws-smithy-types = "=1.9.0"
bytes = "=1.12.1"
http = "=1.5.0"
http-body = "=1.1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
