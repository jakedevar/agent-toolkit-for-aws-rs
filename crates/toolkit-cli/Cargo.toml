[package]
name = "toolkit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only Agent Toolkit command-line interface (bootstrap slice #4373)."

[[bin]]
name = "toolkit"
path = "src/main.rs"

[features]
default = []
# The AWS SDK binding (#4413 S1): the real SigV4 signer and HTTPS transport for
# the `asm exec` MCP fallback (#4582) and the MCP proxy. Off by default so the
# ordinary build compiles no AWS SDK crate.
aws-sdk = ["toolkit-aws/sdk"]
docgraph-live = ["aws-sdk", "toolkit-aws/gremlin", "dep:aws-sdk-docdb", "dep:aws-sdk-cloudwatch", "dep:aws-sdk-ec2", "dep:aws-sdk-secretsmanager", "dep:aws-credential-types", "dep:aws-runtime", "dep:aws-smithy-runtime-api", "dep:aws-smithy-types", "dep:tokio", "dep:aws-sdk-neptunegraph", "dep:aws-sdk-dynamodb", "dep:xmlparser"]
# The live x402 payment constructors (#5352, design section 7 G1): real
# config, credentials, DNS, payment TLS roots and transports. Only release
# builds and the operator live run enable it; every test target refuses it
# (G1a), and no verification recipe passes it except `make clippy-live`.
agents-pay-live = ["aws-sdk"]

[dependencies]
toolkit-aws = { path = "../toolkit-aws" }
toolkit-core = { path = "../toolkit-core" }
aws-sdk-docdb = { version = "=1.126.0", optional = true, default-features = false }
aws-sdk-cloudwatch = { version = "=1.138.0", optional = true, default-features = false }
aws-sdk-ec2 = { version = "=1.271.0", optional = true, default-features = false }
aws-sdk-secretsmanager = { version = "=1.123.0", optional = true, default-features = false }
# S4 modeled request serializers only: no SDK HTTP connector, auth, or retries.
aws-sdk-neptunegraph = { version = "=1.116.0", optional = true, default-features = false }
aws-sdk-dynamodb = { version = "=1.134.0", optional = true, default-features = false }
aws-credential-types = { version = "=1.3.1", optional = true }
aws-runtime = { version = "=1.10.2", optional = true, default-features = false }
aws-smithy-runtime-api = { version = "=1.19.1", optional = true, features = ["client"] }
aws-smithy-types = { version = "=1.9.0", optional = true, features = ["rt-tokio"] }
tokio = { version = "=1.54.1", optional = true, default-features = false, features = ["rt", "time"] }
fancy-regex = "0.19"
jsonschema = { version = "0.60", default-features = false }
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
time = { version = "=0.3.55", features = ["parsing"] }
roxmltree = "=0.14.1"
# Use the same already-locked tokenizer as roxmltree and aws-smithy-xml to
# refuse both DTD token forms explicitly in the review bridge (#5544).
xmlparser = { version = "=0.13.6", optional = true }
toolkit-msk = { path = "../toolkit-msk" }
# Launch with AWS (#4382, L0-L2 #5085): the OS CSPRNG for temporary names and
# (from L3) PKCE, and raw deflate for the strict ZIP container (Q2).
getrandom = "=0.3.4"
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }

# Descriptor-relative file-system calls for the launch archive boundary
# (R-AR-OPEN, #5039); the version #5017 S1 pins. Used only in
# `launch/archive/fsops.rs`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process", "stdio"] }
nix = { version = "=0.29.0", default-features = false, features = ["user"] }

# The recorded-response contract (`tests/recorded_contract.rs`, #4751) reads
# the slices' syntax tree; span locations give it the line of each finding.
[dev-dependencies]
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "=0.29.0", default-features = false, features = ["process", "ptrace", "signal"] }

[lints]
workspace = true
