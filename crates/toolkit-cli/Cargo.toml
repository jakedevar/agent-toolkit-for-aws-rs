[package]
name = "toolkit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only Agent Toolkit command-line interface (bootstrap slice #4373)."

[[bin]]
name = "toolkit"
path = "src/main.rs"

[dependencies]
toolkit-core = { path = "../toolkit-core" }
fancy-regex = "0.19"
jsonschema = { version = "0.60", default-features = false }
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
toolkit-msk = { path = "../toolkit-msk" }

[lints]
workspace = true
