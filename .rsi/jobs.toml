# Public daemon recipe manifest (AgentSubmitJob kind=test {recipe}).
# Recipes run `make <target>` in the worktree; the Makefile relies on the
# daemon-stamped build environment (CARGO_TARGET_DIR, RUSTC_WRAPPER/sccache)
# and never overrides it. These recipes cover fmt, clippy, the workspace
# test suite and the toolkit-aws `sdk` feature (clippy-sdk, test-sdk);
# candidate verification itself remains the daemon scoped_test
# path (Issue #4373 AC4).
version = 1

[recipes.docgraph-spike]
runner = "make"
target = "docgraph-spike"
timeout_minutes = 20
cpu_quota_percent = 200

[recipes.docgraph-live-wipe]
runner = "make"
target = "docgraph-live-wipe"
timeout_minutes = 20
cpu_quota_percent = 200

[recipes.docgraph-live-consent]
runner = "make"
target = "docgraph-live-consent"
timeout_minutes = 20
cpu_quota_percent = 200

[recipes.docgraph-live-modes]
runner = "make"
target = "docgraph-live-modes"
timeout_minutes = 20
cpu_quota_percent = 200

[recipes.fmt]
runner = "make"
target = "fmt"
timeout_minutes = 5
cpu_quota_percent = 200

[recipes.clippy]
runner = "make"
target = "clippy"
timeout_minutes = 10
cpu_quota_percent = 200

[recipes.workspace-test]
runner = "make"
target = "test"
timeout_minutes = 10
cpu_quota_percent = 200

# The toolkit-aws `sdk` feature (#4463) builds the AWS SDK dependency tree
# (aws-lc-sys, hyper, rustls), so it has its own recipes and a longer timeout.
[recipes.clippy-sdk]
runner = "make"
target = "clippy-sdk"
timeout_minutes = 20
cpu_quota_percent = 200

[recipes.test-sdk]
runner = "make"
target = "test-sdk"
timeout_minutes = 20
cpu_quota_percent = 200
