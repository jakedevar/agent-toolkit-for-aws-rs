# Public daemon recipe manifest (AgentSubmitJob kind=test {recipe}).
# Recipes run `make <target>` in the worktree; the Makefile relies on the
# daemon-stamped build environment (CARGO_TARGET_DIR, RUSTC_WRAPPER/sccache)
# and never overrides it. These recipes cover fmt, clippy, the workspace
# test suite and the toolkit-aws `sdk` feature (clippy-sdk, test-sdk);
# candidate verification itself remains the daemon scoped_test
# path (Issue #4373 AC4).
version = 1

[recipes.plugin-binaries-check]
runner = "make"
target = "plugin-binaries-check"
timeout_minutes = 10
cpu_quota_percent = 200

[recipes.toolkit-plugin-check]
runner = "make"
target = "toolkit-plugin-check"
timeout_minutes = 20
cpu_quota_percent = 200

