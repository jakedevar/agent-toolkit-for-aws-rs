# OpenClaw package node tests (#5158): `npm ci --offline` and the package's
# node tests in a fresh network namespace, no Python, dependencies only from
# the out-of-repo offline cache checked against package-lock.json. Fails
# closed (exit 3) while the cache is missing; the operator fills it once with
# `make openclaw-npm-cache` (see docs/migration/ci-gates.md).
[recipes.openclaw-node-test]
runner = "make"
target = "openclaw-node-test"
timeout_minutes = 10
cpu_quota_percent = 200
