# Diagnostic recipes for daemon AgentSubmitJob kind=test {recipe}. These are
# diagnostics only; they do not substitute for the required committed-source
# scoped_test candidate evidence (Issue #4373 AC4).
#
# These recipes match .rsi/jobs.toml. The resolver merges both declarations;
# identical duplicate recipes are permitted. Earlier submissions returned the
# opaque `job_recipe_invalid`: the declarations omitted the required
# cpu_quota_percent field. Each recipe now includes the documented 200% cap.
# These are diagnostic roles only; the trusted Rust candidate gate still applies.
version = 1

[recipes.fmt]
runner = "make"
target = "fmt"
timeout_minutes = 5
cpu_quota_percent = 200

[recipes.clippy]
runner = "make"
target = "clippy"
timeout_minutes = 10
cpu_quota_percent = 200

[recipes.workspace-test]
runner = "make"
target = "test"
timeout_minutes = 10
cpu_quota_percent = 200

# The toolkit-aws `sdk` feature (#4463) builds the AWS SDK dependency tree
# (aws-lc-sys, hyper, rustls), so it has its own recipes and a longer timeout.
[recipes.clippy-sdk]
runner = "make"
target = "clippy-sdk"
timeout_minutes = 20
cpu_quota_percent = 200

[recipes.test-sdk]
runner = "make"
target = "test-sdk"
timeout_minutes = 20
cpu_quota_percent = 200
