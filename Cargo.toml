[workspace]
resolver = "2"
members = ["crates/secret-safety-hook", "crates/toolkit-aws", "crates/toolkit-cli", "crates/toolkit-core", "crates/serverless-recipes", "crates/toolkit-msk", "skills/core-skills/aws-serverless/assets/powertools-handler", "skills/specialized-skills/serverless-skills/processing-s3-uploads-with-step-functions/scripts"]
exclude = ["plugins"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/awslabs/agent-toolkit"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
